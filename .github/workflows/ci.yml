name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v
      - run: python scripts/verify_fixtures.py
      - run: python scripts/layer1_formula_buckets.py --check
      - run: python scripts/layer1_coverage.py --check
      - run: python scripts/leakage_check.py
