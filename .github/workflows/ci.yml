name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v
      - name: conformance (Tier 1 — Lean-derived golden vectors, #23)
        run: python -m pytest tests/test_conformance.py -v
      - run: python scripts/verify_fixtures.py
      - run: python scripts/club_overlap_report.py verify
      - run: python scripts/club_identity_check.py
      - run: python scripts/layer1_formula_buckets.py --check
      - run: python scripts/layer1_coverage.py --check
      - run: python scripts/leakage_check.py
      - run: python scripts/fetch_scorecards.py
      - run: python scripts/sejmbench.py rescore-check "results/*.scorecard.json"
      - run: python scripts/sejmbench.py leaderboard --check

  lean-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean toolchain manager; pins via docs/lean/lean-toolchain)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build machine-checked spec (docs/lean)
        working-directory: docs/lean
        run: lake build
